name: build-relay.yml

on:
  workflow_call:
    inputs:
      upstream_tag:
        required: true
        type: string
      source_run_id:
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  prep:
    if: inputs.source_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Prepare runner
        shell: bash
        env:
          UGC_WORK: /mnt/ugc
        run: bash .github/scripts/hosted-prepare.sh
      - name: Clone upstream and prepare tree
        shell: bash
        env:
          UGC_WORK: /mnt/ugc
          DEBIAN_FRONTEND: noninteractive
          TAG: ${{ inputs.upstream_tag }}
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/ungoogled-software/ungoogled-chromium-android.git /mnt/ugc
          cat << 'EOF' >> /mnt/ugc/android_flags.release.gn

          # ThinLTO memory & runner disk optimization
          symbol_level=0
          blink_symbol_level=0
          EOF

          python3 -c "
          p = '/mnt/ugc/patches/src-fix/fix-safe-browsing.patch'
          with open(p, 'r') as f:
              c = f.read()
          target = '--- a/android_webview/browser/safe_browsing/aw_safe_browsing_blocking_page.cc'
          hunk = '''@@ -510,5 +508,3 @@\n void AwBrowserContext::SetExtendedReportingAllowed(bool allowed) {\n-  user_pref_service_->SetBoolean(\n-      ::prefs::kSafeBrowsingExtendedReportingOptInAllowed, allowed);\n }\n--- a/android_webview/browser/safe_browsing/aw_safe_browsing_blocking_page.cc'''
          if target in c and 'SetExtendedReportingAllowed' not in c:
              c = c.replace(target, hunk)
          extra_patch = '''\n--- a/components/safe_browsing/content/browser/triggers/trigger_manager.cc\n+++ b/components/safe_browsing/content/browser/triggers/trigger_manager.cc\n@@ -126,7 +126,7 @@\n     content::WebContents* web_contents) {\n   return DataCollectionPermissions(\n-      IsExtendedReportingOptInAllowed(pref_service),\n+      false,\n       web_contents->GetBrowserContext()->IsOffTheRecord(),\n-      IsExtendedReportingEnabled(pref_service));\n+      false);\n }\n--- a/android_webview/browser/prefetch/aw_prefetch_manager.h\n+++ b/android_webview/browser/prefetch/aw_prefetch_manager.h\n@@ -31,3 +31,4 @@\n #include \"url/gurl.h\"\n+#include \"components/prefs/pref_service.h\"\n'''
          if 'trigger_manager.cc' not in c:
              c += extra_patch
          with open(p, 'w') as f:
              f.write(c)
          print('Patched fix-safe-browsing.patch for WebView')
          "
          bash .github/scripts/hosted-build.sh --install-deps --prepare-only --arch arm64 --target trichrome_webview_target
      - name: Fix WebView SafeBrowsing stubs in prepared tree
        shell: bash
        env:
          UGC_WORK: /mnt/ugc
        run: python3 .github/scripts/patch-webview-fixes.py "${UGC_WORK:-/mnt/ugc}"
      - name: Pack build tree
        shell: bash
        env:
          UGC_WORK: /mnt/ugc
        run: bash .github/scripts/hosted-export.sh
      - name: Save build tree
        uses: actions/upload-artifact@v7
        with:
          name: build-tree-arm64
          path: build-tree.tar.zst
          retention-days: 3
          overwrite: true
          compression-level: 0

  part-01:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: prep
    if: ${{ !cancelled() && (needs.prep.result == 'success' || needs.prep.result == 'skipped') }}
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          source_run_id: ${{ inputs.source_run_id }}
          upstream_tag: ${{ inputs.upstream_tag }}
          keystore_b64: ${{ secrets.KEYSTORE_B64 }}
          keystore_pass: ${{ secrets.KEYSTORE_PASS }}

  part-02:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: part-01
    if: needs.part-01.outputs.status == 'running'
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          upstream_tag: ${{ inputs.upstream_tag }}
          keystore_b64: ${{ secrets.KEYSTORE_B64 }}
          keystore_pass: ${{ secrets.KEYSTORE_PASS }}

  part-03:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: part-02
    if: needs.part-02.outputs.status == 'running'
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          upstream_tag: ${{ inputs.upstream_tag }}
          keystore_b64: ${{ secrets.KEYSTORE_B64 }}
          keystore_pass: ${{ secrets.KEYSTORE_PASS }}

  part-04:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: part-03
    if: needs.part-03.outputs.status == 'running'
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          upstream_tag: ${{ inputs.upstream_tag }}
          keystore_b64: ${{ secrets.KEYSTORE_B64 }}
          keystore_pass: ${{ secrets.KEYSTORE_PASS }}

  part-05:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: part-04
    if: needs.part-04.outputs.status == 'running'
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          upstream_tag: ${{ inputs.upstream_tag }}
          keystore_b64: ${{ secrets.KEYSTORE_B64 }}
          keystore_pass: ${{ secrets.KEYSTORE_PASS }}

  part-06:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: part-05
    if: needs.part-05.outputs.status == 'running'
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          upstream_tag: ${{ inputs.upstream_tag }}
          keystore_b64: ${{ secrets.KEYSTORE_B64 }}
          keystore_pass: ${{ secrets.KEYSTORE_PASS }}

  part-07:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: part-06
    if: needs.part-06.outputs.status == 'running'
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - id: stage
        uses: ./.github/actions/build-stage
        with:
          upstream_tag: ${{ inputs.upstream_tag }}
          keystore_b64: ${{ secrets.KEYSTORE_B64 }}
          keystore_pass: ${{ secrets.KEYSTORE_PASS }}
