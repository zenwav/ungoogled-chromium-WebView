name: Release Vanadium WebView Module

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to package'
        required: true
        default: 'vanadium'
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || 'vanadium' }}

      - name: Prepare module and generate zip
        id: build_module
        shell: bash
        run: |
          # Date in yy-mm-dd format (e.g., 26-10-12)
          VERSION=$(date +'%y-%m-%d')
          VCODE=$(date +'%y%m%d')

          echo "Setting module version to: ${VERSION} (code: ${VCODE})"
          sed -i "s/^version=.*/version=${VERSION}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${VCODE}/" module.prop

          MODULE_NAME="Vanadium-WebView-${VERSION}"
          ZIP_NAME="${MODULE_NAME}.zip"

          echo "Packaging ${ZIP_NAME}..."
          zip -r9 "${ZIP_NAME}" \
            META-INF \
            Overlay \
            bin \
            common \
            customize.sh \
            module.prop \
            service.sh \
            system \
            uninstall.sh -x "*/.placeholder"

          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "MODULE_NAME=${MODULE_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.MODULE_NAME }}
          name: ${{ env.MODULE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
